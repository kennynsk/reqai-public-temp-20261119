name: reqai-ux

x-app-environment: &app-environment
  NODE_ENV: development
  ASYNC_PLATFORM_ENABLED: "true"
  DEPLOYMENT_SITE_ID: local-dc
  AUTH_ENABLED: "false"
  DEFAULT_TENANT_ID: default-enterprise
  DATABASE_URL: postgresql://reqai:reqai-local@postgres:5432/reqai
  DATABASE_SSL_MODE: disable
  DATABASE_POOL_MIN: "1"
  DATABASE_POOL_MAX: "20"
  KAFKA_BROKERS: kafka:29092
  KAFKA_SSL_ENABLED: "false"
  KAFKA_JOB_EVENTS_TOPIC: reqai.job-events.v1
  KAFKA_WEBHOOK_DLQ_TOPIC: reqai.webhook-dlq.v1
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: reqai
  TEMPORAL_TLS_ENABLED: "false"
  TEMPORAL_WORKFLOW_BUILD_ID: reqai-local-v1
  LLM_PROVIDER_MODE: "${LLM_PROVIDER_MODE:-mock}"
  LLM_MOCK_DELAY_MS: "${LLM_MOCK_DELAY_MS:-750}"
  LLM_REQUEST_TIMEOUT_MS: "${LLM_REQUEST_TIMEOUT_MS:-600000}"
  ZAI_MODELS: "${ZAI_MODELS:-glm-5.3-flash,glm-5.3,glm-5.2,glm-5-turbo,glm-4.7,glm-4.7-flash}"
  LLM_MODEL_PRIORITY: "${LLM_MODEL_PRIORITY:-glm-5.3-flash,glm-5.3,glm-5.2}"
  WEBHOOK_ENABLED: "false"
  LOG_LEVEL: info

x-app-service: &app-service
  build:
    context: .
    dockerfile: server/Dockerfile
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
    temporal-init:
      condition: service_completed_successfully
  read_only: true
  tmpfs:
    - /tmp
  networks:
    - reqai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/postgres-init.sql:/docker-entrypoint-initdb.d/10-reqai.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - reqai

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "59092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "6"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - reqai

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic reqai.job-events.v1 --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic reqai.webhook-dlq.v1 --partitions 3 --replication-factor 1
    networks:
      - reqai

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres-local
      POSTGRES_SEEDS: postgres
      ENABLE_ES: "false"
    ports:
      - "57233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - reqai

  temporal-init:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        tctl --address temporal:7233 --namespace reqai namespace describe >/dev/null 2>&1 || tctl --address temporal:7233 --namespace reqai namespace register --rd 7
    networks:
      - reqai

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:58080
    ports:
      - "58088:8080"
    networks:
      - reqai

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *app-environment
      APP_ROLE: api
    command: ["node", "server/scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reqai

  api:
    <<: *app-service
    networks:
      reqai:
        aliases: [reqai-api]
    env_file:
      - path: "${REQAI_UX_CREDENTIAL_FILE:-.env.ux.local}"
        required: false
    environment:
      <<: *app-environment
      APP_ROLE: api
      PORT: "5178"
    ports:
      - "55178:5178"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5178/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mcp-gateway:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MCP_ENABLED: "true"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "5180"
      MCP_PUBLIC_ENDPOINT: http://localhost:55180/mcp
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-gateway
      MCP_BACKEND_API_URL: http://api:5178
      MCP_IAM_AUDIENCE_MODE: forward-same-audience
      MCP_READINESS_BEARER_TOKEN: local-readiness-token
      MCP_TOOL_SCHEMA_VERSION: 2.2.0
      MCP_BUILD_VERSION: 1.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "55180:5180"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5180/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - reqai

  event-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      APP_ROLE: event-worker
      WORKER_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  decomposition-worker:
    <<: *app-service
    env_file:
      - path: "${REQAI_UX_CREDENTIAL_FILE:-.env.ux.local}"
        required: false
    environment:
      <<: *app-environment
      APP_ROLE: workflow-worker
      TEMPORAL_WORKER_TASK_QUEUE: requirements-decomposition
      TEMPORAL_WORKER_IDENTITY: decomposition-local
      WORKER_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  research-worker:
    <<: *app-service
    env_file:
      - path: "${REQAI_UX_CREDENTIAL_FILE:-.env.ux.local}"
        required: false
    environment:
      <<: *app-environment
      APP_ROLE: workflow-worker
      TEMPORAL_WORKER_TASK_QUEUE: requirements-research
      TEMPORAL_WORKER_IDENTITY: research-local
      WORKER_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  maintenance-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      APP_ROLE: maintenance-worker
      WORKER_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "58080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - reqai

networks:
  reqai:
    name: reqai-ux

volumes:
  postgres-data:
  kafka-data:

apiVersion: apps/v1
kind: Deployment
metadata: { name: reqai-maintenance-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: reqai, role: maintenance-worker } }
  template:
    metadata: { labels: { app: reqai, role: maintenance-worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: worker
        image: "reqai/backend:TBD"
        envFrom: [{ configMapRef: { name: reqai-config } }, { secretRef: { name: reqai-data-secrets } }]
        env: [{ name: APP_ROLE, value: maintenance-worker }]
        ports: [{ name: health, containerPort: 8081 }]

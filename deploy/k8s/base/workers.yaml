apiVersion: apps/v1
kind: Deployment
metadata: { name: reqai-decomposition-worker }
spec:
  replicas: 4
  selector: { matchLabels: { app: reqai, role: decomposition-worker } }
  template:
    metadata: { labels: { app: reqai, role: decomposition-worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints: [{ maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: reqai, role: decomposition-worker } } }]
      containers:
      - name: worker
        image: "reqai/backend:TBD"
        envFrom: [{ configMapRef: { name: reqai-config } }, { secretRef: { name: reqai-data-secrets } }, { secretRef: { name: reqai-llm-secrets } }]
        env: [{ name: APP_ROLE, value: workflow-worker }, { name: TEMPORAL_WORKER_TASK_QUEUE, value: requirements-decomposition }]
        ports: [{ name: health, containerPort: 8081 }]
        startupProbe: { httpGet: { path: /health/live, port: health }, failureThreshold: 30, periodSeconds: 2 }
        livenessProbe: { httpGet: { path: /health/live, port: health }, periodSeconds: 10 }
        readinessProbe: { httpGet: { path: /health/ready, port: health }, periodSeconds: 5 }
        resources: { requests: { cpu: "1", memory: 1Gi }, limits: { cpu: "4", memory: 4Gi } }
        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        volumeMounts: [{ name: temporal-tls, mountPath: /var/run/secrets/temporal, readOnly: true }]
      volumes: [{ name: temporal-tls, secret: { secretName: reqai-temporal-tls } }]
---

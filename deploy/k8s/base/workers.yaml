apiVersion: apps/v1
kind: Deployment
metadata: { name: reqai-event-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: reqai, role: event-worker } }
  template:
    metadata: { labels: { app: reqai, role: event-worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints: [{ maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: reqai, role: event-worker } } }]
      containers:
      - name: worker
        image: "reqai/backend:TBD"
        envFrom: [{ configMapRef: { name: reqai-config } }, { secretRef: { name: reqai-data-secrets } }, { secretRef: { name: reqai-webhook-secrets } }]
        env: [{ name: APP_ROLE, value: event-worker }]

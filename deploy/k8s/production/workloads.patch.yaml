apiVersion: apps/v1
kind: Deployment
metadata:
  name: reqai-frontend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      automountServiceAccountToken: false
      serviceAccountName: reqai
      terminationGracePeriodSeconds: 45
      containers:
        - name: frontend
          command:
            - nginx
          args:
            - '-g'
            - daemon off;
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: reqai-nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reqai-api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      automountServiceAccountToken: false
      serviceAccountName: reqai
      terminationGracePeriodSeconds: 45
      volumes:
        - name: trust
          secret:
            secretName: reqai-trust
            items:
              - key: postgres-ca.crt
                path: postgres-ca.crt
              - key: node-ca.pem
                path: node-ca.pem
              - key: temporal-ca.crt
                path: temporal-ca.crt
        - name: temporal-tls
          secret:
            secretName: reqai-temporal-client
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      containers:
        - name: api
          envFrom:
            - configMapRef:
                name: reqai-production-config
          env:
            - name: APP_ROLE
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reqai-runtime-database
                  key: url
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reqai-zai
                  key: api-key
          volumeMounts:
            - name: trust
              mountPath: /etc/reqai/trust
              readOnly: true
            - name: temporal-tls
              mountPath: /var/run/secrets/temporal
              readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reqai-decomposition-worker
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      automountServiceAccountToken: false
      serviceAccountName: reqai
      terminationGracePeriodSeconds: 660
      volumes:
        - name: trust
          secret:
            secretName: reqai-trust
            items:
              - key: postgres-ca.crt
                path: postgres-ca.crt
              - key: node-ca.pem
                path: node-ca.pem
              - key: temporal-ca.crt
                path: temporal-ca.crt
        - name: temporal-tls
          secret:
            secretName: reqai-temporal-client
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: worker
          envFrom:
            - configMapRef:
                name: reqai-production-config
          env:
            - name: APP_ROLE
              value: workflow-worker
            - name: TEMPORAL_WORKER_TASK_QUEUE
              value: requirements-decomposition
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reqai-runtime-database
                  key: url
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reqai-zai
                  key: api-key
          volumeMounts:
            - name: trust
              mountPath: /etc/reqai/trust
              readOnly: true
            - name: temporal-tls
              mountPath: /var/run/secrets/temporal
              readOnly: true
            - name: tmp
              mountPath: /tmp
---

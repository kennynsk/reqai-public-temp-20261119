apiVersion: apps/v1
kind: Deployment
metadata:
  name: reqai-mcp-gateway
spec:
  replicas: 0
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          envFrom:
            - configMapRef: {name: reqai-production-mcp}
          env:
            - name: MCP_BUILD_VERSION
              value: replace-release-id
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reqai-mcp-gateway
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reqai-mcp-gateway
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: replace-ingress-namespace
      ports:
        - protocol: TCP
          port: 5180
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: reqai
              role: api
      ports:
        - protocol: TCP
          port: 5178
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

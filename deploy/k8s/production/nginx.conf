server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
  # Ingress routes /api directly to reqai-api. No Docker-specific DNS resolver.
  location /api/ { return 404; }
  location ~* \.(js|css|png|svg|woff2)$ { expires 1y; add_header Cache-Control 'public, immutable'; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-store'; }
}

groups:
- name: reqai-enterprise
  rules:
  - alert: ReqAIApiAvailabilityBudget
    expr: sum(rate(http_server_requests_total{service="reqai",code!~"5.."}[30d])) / sum(rate(http_server_requests_total{service="reqai"}[30d])) < 0.995
    for: 15m
  - alert: ReqAIJobAcceptanceP95
    expr: histogram_quantile(0.95,sum by(le)(rate(reqai_job_accept_seconds_bucket[5m]))) > 2
    for: 10m
  - alert: ReqAIStalledJobs
    expr: reqai_jobs_stalled > 0
    for: 5m
  - alert: ReqAIQueueWaitSLO
    expr: histogram_quantile(0.95,sum by(le,job_type)(rate(reqai_job_queue_wait_seconds_bucket[10m]))) > 120
    for: 10m
  - alert: ReqAIBacklogHardLimit
    expr: reqai_job_backlog >= reqai_job_backlog_hard_limit
    for: 2m
  - alert: ReqAIModelCircuitOpen
    expr: reqai_model_circuit_state{state="OPEN"} == 1
    for: 5m
  - alert: ReqAIModelConcurrencySaturated
    expr: reqai_model_active >= reqai_model_concurrency_limit
    for: 10m
  - alert: ReqAIModelFallbackSpike
    expr: sum(rate(reqai_llm_fallback_total[10m])) > 0.1
    for: 10m
  - alert: ReqAIArtifactStorageGrowth
    expr: predict_linear(reqai_artifact_storage_bytes[6h], 24*3600) > reqai_artifact_storage_capacity_bytes * 0.85
    for: 30m
  - alert: ReqAIWebhookDLQ
    expr: increase(reqai_webhook_dlq_total[15m]) > 0
  - alert: ReqAIArtifactRetentionFailure
    expr: increase(reqai_retention_failures_total[15m]) > 0
